<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Toast Talent Modeling Agency</title>

  <!-- SEO -->
  <meta name="description" content="Toast Talent Modeling Agency connects fresh faces with top opportunities in the modeling industry. Bookings, collaborations, and inquiries welcome." />
  <meta name="author" content="Toast Talent Modeling Agency" />
  <link rel="canonical" href="https://toasttalent.co.za/" />

  <!-- Open Graph -->
  <meta property="og:title" content="Toast Talent Modeling Agency" />
  <meta property="og:description" content="Talent with presence, poise, and purpose." />
  <meta property="og:image" content="https://toasttalent.co.za/images/og-image.jpg" />
  <meta property="og:url" content="https://toasttalent.co.za/" />
  <meta property="og:type" content="website" />

  <link rel="icon" type="image/png" href="images/favicon.png" />

  <!-- Fonts & CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    .admin-link { display:none; }

    /* ===== HERO COLLAGE (5 IMAGES ONLY) ===== */
    .bts-hero {
      position: relative;
      height: 68vh;
      min-height: 420px;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      text-align: center;
      background: #fff;
    }

    .bts-collage {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr 1fr 1.2fr;
      gap: 18px;
      padding: 48px;
      opacity: 0.34;
      z-index: 0;
      pointer-events: none;
    }

    .bts-collage img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 14px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.08);
    }

    @media (max-width: 900px) {
      .bts-collage {
        grid-template-columns: 1fr 1fr;
        grid-auto-rows: 240px;
        padding: 24px;
      }
    }

    /* Soft overlay for text clarity */
    .bts-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0.15),
        rgba(255,255,255,0.45)
      );
      z-index: 1;
    }

    .bts-content {
      position: relative;
      z-index: 2;
      padding: 40px 16px 48px;
      max-width: 820px;
      margin: 0 auto;
    }

    .bts-content h1 {
      font-size: clamp(30px, 5vw, 48px);
      font-weight: 800;
      margin-bottom: 10px;
      letter-spacing: .6px;
    }

    .bts-content p {
      font-size: 1.1rem;
      color: rgba(0,0,0,0.75);
      margin-bottom: 18px;
    }

    .bts-cta {
      display: inline-block;
      background: linear-gradient(90deg, var(--danger), var(--accent));
      color: #fff;
      padding: 12px 24px;
      border-radius: 999px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 4px 18px rgba(0,0,0,0.12);
    }
  </style>
</head>

<body class="with-bg">

  <!-- NAV -->
  <nav class="navbar">
    <div class="nav-content">
      <a href="index.html" class="nav-logo">
        <img src="images/Toast Logo.jpeg" alt="Toast Talent Logo">
      </a>
      <ul class="nav-links">
        <li><a href="index.html" class="active">Home</a></li>
        <li><a href="models.html">Models</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="apply.html">Apply</a></li>
      </ul>
    </div>
  </nav>

  <!-- HERO -->
  <section class="bts-hero">
    <div class="bts-collage" aria-hidden="true">
      <img src="images/hero/hero-3.jpg" alt="">
      <img src="images/hero/hero-1.jpg" alt="">
      <img src="images/hero/hero-8.jpg" alt="">
      <img src="images/hero/hero-9.jpg" alt="">
      <img src="images/hero/hero-10.jpg" alt="">
    </div>

    <div class="bts-overlay"></div>

    <div class="bts-content">
      <h1>Refined talent. Global presence.</h1>
      <p>Representing models defined by elegance, individuality, and confidence.</p>
      <a href="models.html" class="bts-cta">View Models</a>
    </div>
  </section>

  <footer>
    &copy; 2025 Toast Talent Modeling Agency
  </footer>

</body>
</html>
