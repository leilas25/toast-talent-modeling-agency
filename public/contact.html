<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact | Toast Talent Modeling Agency</title>

  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,600&display=swap" rel="stylesheet">

  <style>
    .contact-wrap {
      max-width: 1000px;
      margin: 64px auto;
      padding: 0 18px;
      position: relative;
      z-index: 2;
    }

    .contact-card {
      background: rgba(255,255,255,0.68);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,.06);
      overflow: hidden;
      position: relative;
      z-index: 3;
    }

    .contact-head {
      padding: 28px 28px 10px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.85);
    }

    .contact-head h1 {
      margin: 0 0 10px;
      font-size: 2.1rem;
      font-weight: 800;
      background: linear-gradient(90deg,#ee3045,#f9c846,#7cc65a,#2493e1,#a259c6,#f76e2a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .contact-head p {
      margin: 0 0 18px;
      color: #444;
      font-size: 1.05rem;
    }

    .contact-body {
      display: grid;
      grid-template-columns: 1.1fr .9fr;
    }

    @media (max-width: 900px) {
      .contact-body { grid-template-columns: 1fr; }
    }

    .contact-info {
      padding: 28px;
      display: grid;
      gap: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0.98));
    }

    .info-block {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
    }

    .info-block b {
      display: block;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .contact-form-wrap {
      padding: 28px;
      background: #fff;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    @media (max-width: 700px) {
      .form-grid { grid-template-columns: 1fr; }
    }

    .field input,
    .field textarea {
      padding: 14px;
      border-radius: 10px;
      border: 1.2px solid var(--border);
      background: #f7f7f7;
      font-size: 1rem;
    }

    .btn-primary {
      background: linear-gradient(90deg,var(--danger),var(--accent));
      color: #fff;
      padding: 14px 22px;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }

    /* ===== COLLAGE BACKGROUND ===== */
    .bts-collage {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 18px;
      padding: 48px;
      opacity: 0.28;
      pointer-events: none;
      z-index: 0;
      align-content: start;
    }

    /* ✅ OPTION A FIX (THIS IS THE IMPORTANT PART) */
    .bts-collage img {
      width: 100%;
      height: auto;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      border-radius: 12px;
    }

    @media (max-width: 600px) {
      .bts-collage {
        grid-template-columns: 1fr;
        padding: 16px;
        opacity: 0.34;
      }
    }

    .contact-collage-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0.24),
        rgba(255,255,255,0.12),
        rgba(255,255,255,0.36)
      );
    }
  </style>
</head>

<body class="with-bg">

  <div class="bts-collage" aria-hidden="true">
    <img src="images/hero/hero-11.jpg" alt="">
    <img src="images/hero/hero-2.jpg" alt="">
    <img src="images/hero/hero-13.jpg" alt="">
    <img src="images/hero/hero-4.jpg" alt="">
    <img src="images/hero/hero-5.jpg" alt="">
    <img src="images/hero/hero-6.jpg" alt="">
  </div>

  <div class="contact-collage-overlay"></div>

  <nav class="navbar">
    <div class="nav-content">
      <a href="/" class="nav-logo">
        <img src="images/Toast Logo.jpeg" alt="Toast Talent Logo">
      </a>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/models">Models</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/contact" class="active">Contact</a></li>
        <li><a href="/apply">Apply</a></li>
      </ul>
    </div>
  </nav>

  <main class="contact-wrap">
    <section class="contact-card">
      <header class="contact-head">
        <h1>Contact Us</h1>
        <p>Booking enquiries, collabs or questions — reach out below.</p>
      </header>

      <div class="contact-body">
        <div class="contact-info">
          <div class="info-block"><b>Email</b><p>toastalent@gmail.com</p></div>
          <div class="info-block"><b>WhatsApp</b><p>+27 74 656 3428</p></div>
          <div class="info-block"><b>Phone</b><p>+27 73 781 3751</p></div>
          <div class="info-block"><b>Office Hours</b><p>Mon–Fri, 09:00–17:00</p></div>
        </div>

        <div class="contact-form-wrap">
          <form>
            <div class="form-grid">
              <input placeholder="Name" required>
              <input type="email" placeholder="Email" required>
            </div>
            <input placeholder="WhatsApp (optional)">
            <textarea rows="6" placeholder="Your message" required></textarea>
            <button class="btn-primary">Send Message</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer>&copy; 2025 Toast Talent Modeling Agency</footer>

</body>
</html>
