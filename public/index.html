<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Toast Talent Modeling Agency</title>

  <!-- SEO -->
  <meta name="description" content="Toast Talent Modeling Agency connects fresh faces with top opportunities in the modeling industry. Bookings, collaborations, and inquiries welcome." />
  <meta name="keywords" content="Toast Talent, modeling agency, models, fashion, bookings, collaborations" />
  <meta name="author" content="Toast Talent Modeling Agency" />
  <link rel="canonical" href="https://toasttalent.co.za/" />
  <meta name="theme-color" content="#ffffff">

  <!-- Open Graph -->
  <meta property="og:title" content="Toast Talent Modeling Agency" />
  <meta property="og:description" content="Elevating new faces. Connecting talent with opportunity." />
  <meta property="og:image" content="https://toasttalent.co.za/images/og-image.jpg" />
  <meta property="og:url" content="https://toasttalent.co.za/" />
  <meta property="og:type" content="website" />

  <link rel="icon" type="image/png" href="images/favicon.png" />

  <!-- Fonts & CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    .admin-link { display: none; }

    /* ===== COLLAGE HERO ===== */
    .bts-hero {
      position: relative;
      width: 100%;
      height: 68vh;
      min-height: 420px;
      max-height: 780px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: #f5f5f5;
    }

    /* COLLAGE — NOW 5 IMAGES */
    .bts-collage {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(5, 1fr); /* ⬅️ changed from 6 */
      grid-auto-rows: 1fr;
      gap: 12px;
      padding: 48px;
      align-items: center;
      justify-items: center;
      pointer-events: none;
      z-index: 0;
      opacity: 0.30;
      background-color: #fff;
    }

    .bts-collage img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      display: block;
    }

    @media (max-width: 1000px) {
      .bts-collage {
        grid-template-columns: repeat(3, 1fr);
        padding: 20px;
        opacity: 0.28;
      }
      .bts-hero {
        height: 56vh;
        min-height: 360px;
      }
    }

    @media (max-width: 700px) {
      .bts-collage {
        grid-template-columns: repeat(2, 1fr);
        padding: 12px;
        opacity: 0.26;
      }
      .bts-hero {
        height: 50vh;
        min-height: 300px;
      }
    }

    .bts-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0.24) 0%,
        rgba(255,255,255,0.12) 40%,
        rgba(255,255,255,0.02) 70%,
        rgba(255,255,255,0.36) 100%
      );
      z-index: 1;
      pointer-events: none;
    }

    .bts-content {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 40px 16px 46px;
      color: #111;
    }

    .bts-content h1 {
      margin: 0 0 8px 0;
      font-size: clamp(28px, 5vw, 48px);
      font-weight: 800;
      letter-spacing: .5px;
    }

    .bts-content p {
      margin: 0 0 18px 0;
      font-size: 1.05rem;
      color: rgba(0,0,0,0.7);
    }

    .bts-cta {
      display: inline-block;
      background: linear-gradient(90deg, var(--danger), var(--accent));
      color: #fff;
      text-decoration: none;
      padding: 12px 22px;
      border-radius: 999px;
      font-weight: 700;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }
  </style>
</head>

<body class="with-bg">

  <!-- NAV -->
  <nav class="navbar">
    <div class="nav-content">
      <a href="index.html" class="nav-logo">
        <img src="images/Toast Logo.jpeg" alt="Toast Talent Logo">
      </a>
      <ul class="nav-links">
        <li><a href="index.html" class="active">Home</a></li>
        <li><a href="models.html">Models</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="apply.html">Apply</a></li>
      </ul>
    </div>
  </nav>

  <!-- COLLAGE -->
  <section class="bts-hero">
    <div class="bts-collage" aria-hidden="true">
      <img src="images/hero/hero-3.jpg" alt="">
      <img src="images/hero/hero-1.jpg" alt="">
      <img src="images/hero/hero-8.jpg" alt="">
      <img src="images/hero/hero-9.jpg" alt="">
      <img src="images/hero/hero-10.jpg" alt="">
    </div>

    <div class="bts-overlay"></div>

    <div class="bts-content">
      <h1>Real moments. Real talent.</h1>
      <p>Talent with presence, poise, and purpose.</p>
      <a class="bts-cta" href="models.html">View Models</a>
    </div>
  </section>

  <footer>
    &copy; 2025 Toast Talent Modeling Agency
  </footer>

</body>
</html>
